<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Add Actor • Simple Movie Database</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles/main.css" />
	<script type="module" src="/scripts/Actors/add.js" defer></script>
</head>

<body>
	<header>
		<h1>Add Actor</h1>
		<nav>
			<ul>
				<li><a href="/" class="btn">Home</a></li>
				<li><a href="/Actors/" class="btn">Actors</a></li>
			</ul>
		</nav>
	</header>
	<main class="container">
		<div id="status" class="status"></div>
		<form id="form">
			<fieldset>
				<legend>Actor Details</legend>
				<div class="form-group">
					<label for="name">Name:</label>
					<input type="text" id="name" name="name" required />
				</div>
				<div class="form-group">
					<label for="birthYear">Birth Year:</label>
					<input type="number" id="birthYear" name="birthYear" required />
				</div>
				<div class="form-group">
					<label for="biography">Biography:</label>
					<textarea id="biography" name="biography"></textarea>
				</div>
				<div class="form-group">
					<button type="submit" class="btn">Create Actor</button>
					<a href="/Actors/" class="btn">Cancel</a>
				</div>
			</fieldset>
		</form>
	</main>
</body>

</html>
