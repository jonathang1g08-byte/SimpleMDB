<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>Edit Actor-Movie Credit • Simple Movie Database</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles/main.css" />
</head>

<body>
	<header>
		<h1>Edit Actor-Movie Credit</h1>
		<nav>
			<ul>
				<li><a href="/" class="btn">Home</a></li>
				<li><a href="/ActorMovie/" class="btn">Credits</a></li>
			</ul>
		</nav>
	</header>
	<main class="container">
		<div id="status" class="status">Loading...</div>
		<form id="form">
			<fieldset>
				<legend>Credit Details</legend>
				<div class="form-group">
					<label for="actorId">Actor ID:</label>
					<input type="number" id="actorId" name="actorId" required />
				</div>
				<div class="form-group">
					<label for="movieId">Movie ID:</label>
					<input type="number" id="movieId" name="movieId" required />
				</div>
				<div class="form-group">
					<label for="role">Role:</label>
					<input type="text" id="role" name="role" required />
				</div>
				<div class="form-group">
					<button type="submit" class="btn">Update Credit</button>
					<a href="/ActorMovie/" class="btn">Cancel</a>
				</div>
			</fieldset>
		</form>
	</main>
</body>

</html>
