<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<title>View Movie • Simple Movie Database</title>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="/styles/main.css" />
</head>

<body>
	<header>
		<h1>View Movie</h1>
		<nav>
			<ul>
				<li><a href="/" class="btn">Home</a></li>
				<li><a href="/Movies/index.html" class="btn">All Movies</a></li>
				<li><a href="/Actors/index.html" class="btn">Actors</a></li>

			<tbody>
				<tr>
					<th>ID</th>
					<td id="movie-id">—</td>

				<tr>
					<th>Title</th>
					<td id="movie-title">—</td>
				</tr>
				<tr>
					<th>Year</th>
					<td id="movie-year">—</td>
				</tr>
				<tr>
					<th>Description</th>
					<td id="movie-desc">—</td>
				</tr>
			</tbody>
		</table>
	</main>

</html>
